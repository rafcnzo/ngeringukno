<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src http: https: file: data: blob:">
  <title>Ngeringukno notch</title>
  <style>
    :root {
      --island: #000;
      --ink: #fff;
      --ink-soft: rgba(255, 255, 255, 0.66);
      --ink-faint: rgba(255, 255, 255, 0.22);
      --accent: rgb(140, 120, 255);
      --closed-w: 252px;
      --closed-h: 36px;
      --open-w: 420px;
      --open-h: 168px;
      --spring: cubic-bezier(0.32, 1.28, 0.5, 1);
      --settle: cubic-bezier(0.22, 1, 0.36, 1);
    }
    .lyrics-on.has-lyrics { --closed-w: 360px; }

    * { box-sizing: border-box; margin: 0; }
    html, body { background: transparent; overflow: hidden; height: 100%; user-select: none; }
    /* system font: nothing to download, so the first frame is already final */
    body { font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
    ::selection { background: transparent; }

    /* only clip-path, opacity and transform animate; no filters, so each frame stays cheap in a transparent window */
    .island {
      position: absolute; top: 0; left: 50%; translate: -50% 0;
      width: var(--open-w); height: var(--open-h);
      background: var(--island);
      clip-path: inset(0 calc((var(--open-w) - var(--closed-w)) / 2) calc(var(--open-h) - var(--closed-h)) round 0 0 18px 18px);
      transition: clip-path 240ms var(--settle);
      will-change: clip-path;
    }
    .island.open {
      clip-path: inset(0 0 0 0 round 0 0 34px 34px);
      transition: clip-path 380ms var(--spring);
    }

    /* collapsed strip */
    .mini {
      position: absolute; top: 0; left: 50%; translate: -50% 0;
      width: var(--closed-w); height: var(--closed-h);
      display: flex; align-items: center; gap: 10px; padding: 0 16px 0 10px;
      cursor: pointer;
      transition: opacity 140ms ease-out;
    }
    .open .mini { opacity: 0; pointer-events: none; }
    .mini-cover { width: 22px; height: 22px; border-radius: 7px; flex: none; background: var(--accent) center / cover no-repeat; }
    .mini-title { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .bars { display: flex; align-items: flex-end; gap: 2.5px; height: 14px; flex: none; }
    .bars i { width: 3px; height: 14px; border-radius: 2px; background: var(--accent); transform-origin: bottom; transform: scaleY(0.3); }
    .playing .bars i { animation: bar 900ms ease-in-out infinite alternate; }
    .playing .bars i:nth-child(1) { animation-duration: 760ms; }
    .playing .bars i:nth-child(2) { animation-duration: 980ms; animation-delay: -300ms; }
    .playing .bars i:nth-child(3) { animation-duration: 640ms; animation-delay: -120ms; }
    .playing .bars i:nth-child(4) { animation-duration: 860ms; animation-delay: -480ms; }
    @keyframes bar { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }

    /* expanded card */
    .full {
      position: absolute; inset: 0;
      display: grid; grid-template-columns: 96px 1fr; column-gap: 18px; align-items: center;
      padding: 22px 26px 20px;
      opacity: 0; transform: translateY(-8px) scale(0.97);
      transition: opacity 90ms ease-out, transform 120ms ease-out;
      pointer-events: none;
    }
    .open .full {
      opacity: 1; transform: none;
      transition: opacity 180ms var(--settle), transform 300ms var(--settle);
      pointer-events: auto;
    }

    .art {
      width: 96px; height: 96px; border-radius: 20px; padding: 0; border: 0; cursor: pointer;
      background: var(--accent) center / cover no-repeat;
      box-shadow: 0 10px 26px -6px var(--accent);
      transition: transform 180ms var(--settle);
    }
    .art:hover { transform: scale(1.03); }
    .art:active { transform: scale(0.97); }

    .meta { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .titles { min-width: 0; }
    .title { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { margin-top: 2px; font-size: 13px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .time { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
    .track { height: 4px; border-radius: 2px; background: var(--ink-faint); overflow: hidden; }
    .track b { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); }

    /* lyrics replace title and time while lyrics mode is on */
    .lyrics { display: none; min-width: 0; height: 64px; flex-direction: column; justify-content: center; gap: 3px; }
    .lyrics div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ly-prev, .ly-next { font-size: 12px; color: var(--ink-faint); }
    .ly-cur { font-size: 15px; font-weight: 700; color: var(--ink); }
    .lyrics-on.has-lyrics .titles, .lyrics-on.has-lyrics .time { display: none; }
    .lyrics-on.has-lyrics .lyrics { display: flex; }

    .controls { display: flex; align-items: center; gap: 6px; }
    .btn {
      width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0;
      display: grid; place-items: center; cursor: pointer;
      background: transparent; color: var(--ink);
      transition: background 120ms ease-out, transform 120ms ease-out, color 120ms ease-out;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.12); }
    .btn:active { transform: scale(0.9); }
    .btn svg { width: 22px; height: 22px; fill: currentColor; }
    .btn.play { width: 40px; height: 40px; background: var(--ink); color: var(--island); }
    .btn.play:hover { background: rgba(255, 255, 255, 0.86); }
    .btn.play svg { width: 24px; height: 24px; }
    .btn.lyr { margin-left: auto; display: none; color: var(--ink-soft); }
    .btn.lyr svg { width: 19px; height: 19px; }
    .has-lyrics .btn.lyr { display: grid; }
    .lyrics-on .btn.lyr { color: var(--accent); background: rgba(255, 255, 255, 0.08); }
    .btn:focus-visible, .art:focus-visible, .mini:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon-pause { display: none; }
    .playing .icon-play { display: none; }
    .playing .icon-pause { display: block; }

    @media (prefers-reduced-motion: reduce) {
      .island, .island.open { transition: clip-path 1ms; }
      .playing .bars i { animation: none; transform: scaleY(0.7); }
      .full, .open .full { transform: none; }
    }
  </style>
</head>
<body>
  <div class="island" id="island">
    <div class="mini" id="mini" role="button" aria-label="Show player">
      <span class="mini-cover" id="miniCover" aria-hidden="true"></span>
      <span class="mini-title" id="miniTitle"></span>
      <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    </div>

    <div class="full">
      <button class="art" id="art" type="button" aria-label="Open Ngeringukno"></button>
      <div class="meta">
        <div class="titles">
          <div class="title" id="title"></div>
          <div class="artist" id="artist"></div>
        </div>
        <div class="time">
          <span id="elapsed">0:00</span>
          <span class="track"><b id="progress"></b></span>
          <span id="total">0:00</span>
        </div>
        <div class="lyrics" aria-live="polite">
          <div class="ly-prev" id="lyPrev"></div>
          <div class="ly-cur" id="lyCur"></div>
          <div class="ly-next" id="lyNext"></div>
        </div>
        <div class="controls">
          <button class="btn" type="button" data-cmd="prev" aria-label="Previous track">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="btn play" type="button" data-cmd="toggle" aria-label="Play or pause">
            <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
          </button>
          <button class="btn" type="button" data-cmd="next" aria-label="Next track">
            <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6v12h2V6z"/></svg>
          </button>
          <button class="btn lyr" id="lyricsBtn" type="button" aria-label="Show lyrics" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M4 6h11v2H4zm0 4h11v2H4zm0 4h7v2H4zm13-8v8.2A3 3 0 1 0 19 17V9h3V6z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="notch.js"></script>
</body>
</html>
